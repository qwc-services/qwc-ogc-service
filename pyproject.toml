[project]
name = "qwc-ogc-service"
version = "v2026.10.16"
description = "QWC OGC Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask~=3.1.0",
    "Werkzeug~=3.1.4",
    "Flask-JWT-Extended~=4.7.0",
    "flask-restx~=1.3.0",
    "requests~=2.33.0",
    "qwc-services-core~=1.7.0",
    "pillow>=12.3.0",
    "psycopg[c]>=3.3.6",
    "geomet>=1.1.0",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
extend-select = ["C417"]
